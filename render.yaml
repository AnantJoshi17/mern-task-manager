# render.yaml — a Render "Blueprint".
#
# This file is what makes deployment close to automatic. Instead of clicking
# through forms to create two services, Render reads this file from your repo
# and creates both of them for you.
#
# Everything here is public, so secrets are NOT stored in this file.
# "sync: false" means: ask me for this value in the dashboard, do not read it
# from the repo. That is where MONGO_URI goes.

services:
  # ---- 1. The backend API (Node + Express) ----
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: server # only build this folder, ignore client/
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false # you paste your Atlas connection string in the dashboard
      - key: CLIENT_URL
        sync: false # the frontend URL, so CORS only allows your own site

  # ---- 2. The frontend (React, built into plain static files) ----
  - type: web
    runtime: static
    name: task-manager-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist # where Vite puts the built files
    envVars:
      - key: VITE_API_URL
        sync: false # the API URL from the service above
    routes:
      # A single-page app has only one real HTML file. This tells the host to
      # serve index.html for any path, so refreshing a URL does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
